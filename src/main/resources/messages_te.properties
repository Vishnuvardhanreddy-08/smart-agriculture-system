error.missingParam="{0}" వివరం ఇవ్వలేదు
error.methodNotAllowed=ఈ చిరునామాకు {0} పద్ధతి అనుమతించబడదు
error.mediaType=ఈ రకమైన కంటెంట్ అంగీకరించబడదు. వివరాలను JSON రూపంలో పంపండి.
error.endpointNotFound=ఈ చిరునామా కనుగొనబడలేదు
error.dataIntegrity=ఈ రికార్డు ఇతర రికార్డులతో ముడిపడి ఉంది, కాబట్టి దీన్ని తొలగించలేరు లేదా మార్చలేరు. ముందుగా ఆ రికార్డులను తొలగించండి లేదా మార్చండి.
error.server=సర్వర్‌లో ఏదో తప్పు జరిగింది. దయచేసి కొంతసేపటి తర్వాత మళ్లీ ప్రయత్నించండి.

