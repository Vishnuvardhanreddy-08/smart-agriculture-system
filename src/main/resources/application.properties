# Name of our application (shows in logs)
spring.application.name=SmartAgricultureSystem

# ---------- DATABASE CONNECTION ----------
# ${...} means: "read this value from an environment variable".
# The real values are NOT written here, so GitHub stays safe.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ---------- JPA / HIBERNATE ----------
# update = Hibernate creates or adjusts tables automatically from our entity classes.
spring.jpa.hibernate.ddl-auto=update

# Print the SQL that Hibernate runs, so we can learn what happens behind the scenes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- SERVER PORT ----------
# Use the PORT environment variable if it exists (Render sets it).
# If not, use 8080 (our local port).
server.port=${PORT:8080}

# ---------- CORS ----------
# Frontend address(es) allowed to call this API. Separate several with commas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- JWT (login tokens) ----------
# The secret key that signs login tokens. It MUST come from an environment variable,
# and must be at least 32 characters long.
app.jwt.secret=${JWT_SECRET}
# How long a login token stays valid, in minutes (480 minutes = 8 hours).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---------- MESSAGES (text sent by the server, in English and Telugu) ----------
# The message files are messages.properties (English) and messages_te.properties (Telugu).
spring.messages.basename=messages
# Read the files as UTF-8, so Telugu letters work.
spring.messages.encoding=UTF-8
# If a language has no file (for example French), use English, not the computer's own language.
spring.messages.fallback-to-system-locale=false
# The language to use when the request does not say one.
spring.web.locale=en